# Nginx front door for the built SPA.
#
# The browser only ever talks to this container: /api/* is proxied to the API
# service, everything else falls back to index.html so client-side routes work
# on a hard refresh.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are not part of the product yet; a small cap keeps abusive
    # requests cheap to reject.
    client_max_body_size 2m;

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- Security headers --------------------------------------------------
    # YouTube is allowed explicitly because lessons embed videos and the
    # player pulls its script from youtube.com / s.ytimg.com.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://www.youtube.com; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' blob: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- API ---------------------------------------------------------------
    # The upstream is resolved per request through Docker's embedded DNS, so a
    # restarted API container gets picked up without restarting nginx.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $learnora_api http://api:8000;

        proxy_pass $learnora_api$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- Hashed build assets ----------------------------------------------
    # Vite fingerprints these filenames, so they can be cached forever. Only
    # `expires` is used here: an `add_header` in a location block would drop
    # the security headers inherited from the server block above.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ---- SPA shell ---------------------------------------------------------
    # Never cache the shell, or a deploy keeps pointing browsers at old bundles.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

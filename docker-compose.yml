# Learnora - production stack: PostgreSQL + FastAPI API + nginx-served SPA.
#
#   cp .env.docker.example .env.docker    # then fill in the secrets
#   docker compose --env-file .env.docker up -d --build
#
# Only the web container publishes a port. The database and the API are
# reachable inside the compose network only.

name: learnora

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillearn}
      POSTGRES_USER: ${POSTGRES_USER:-skillearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env.docker}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging
    networks: [app]

  api:
    build:
      context: ./backend
    image: ${API_IMAGE:-learnora-api:latest}
    restart: unless-stopped
    # Reap zombies and forward SIGTERM so `docker compose stop` is clean.
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: ${ENV:-production}

      # The host is the compose service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skillearn}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skillearn}
      DB_WAIT_TIMEOUT_SECONDS: ${DB_WAIT_TIMEOUT_SECONDS:-90}

      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required. Generate one with python -c "import secrets; print(secrets.token_urlsafe(48))"}'
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      # Browsers reach the API through nginx, so this is the public origin.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

      SUBSCRIPTION_PRICE_PAISE: ${SUBSCRIPTION_PRICE_PAISE:-14900}
      SUBSCRIPTION_DAYS: ${SUBSCRIPTION_DAYS:-30}

      REWARDS_ENABLED: ${REWARDS_ENABLED:-true}
      REWARD_DAILY_LIMIT_PAISE: ${REWARD_DAILY_LIMIT_PAISE:-50000}
      REWARD_PER_TASK_LIMIT_PAISE: ${REWARD_PER_TASK_LIMIT_PAISE:-20000}
      REWARD_MAX_PERCENT_OF_REVENUE: ${REWARD_MAX_PERCENT_OF_REVENUE:-50}
      VIDEO_REWARD_PAISE: ${VIDEO_REWARD_PAISE:-500}
      ATTEMPT_COOLDOWN_SECONDS: ${ATTEMPT_COOLDOWN_SECONDS:-10}
      SUBMISSION_RATE_LIMIT_PER_MINUTE: ${SUBMISSION_RATE_LIMIT_PER_MINUTE:-20}

      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      QUIZ_QUESTIONS_PER_TOPIC: ${QUIZ_QUESTIONS_PER_TOPIC:-5}

      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Learnora Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@skillearn.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${API_WORKERS:-2}
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --log-level
      - info
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    logging: *default-logging
    networks: [app]

  web:
    build:
      context: ./frontend
      args:
        # Relative, so the browser calls nginx and nginx calls the API.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: ${WEB_IMAGE:-learnora-web:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    logging: *default-logging
    networks: [app]

volumes:
  db_data:

networks:
  app:

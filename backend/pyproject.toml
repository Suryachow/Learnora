[project]
name = "skillearn-backend"
version = "0.1.0"
description = "Learnora API - learn skills, pass assessments, earn rewards."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
